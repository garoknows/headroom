name: Wiggleroom
options:
  bundleIdPrefix: io.github.garoknows
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

# The one place the version and build numbers live (lesson 18). Info.plists read them,
# scripts/build-direct.sh and the release workflow read them, and CI fails if anything disagrees.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WiggleroomCore:
    path: Packages/WiggleroomCore

targets:
  # The menu bar helper. Not sandboxed: it must read its own data folder and, only when the
  # user clicks Connect, edit ~/.claude/settings.json. Hardened runtime, Developer ID signed.
  Wiggleroom:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: WiggleroomCore
        product: WiggleroomCore
      - package: WiggleroomCore
        product: WiggleroomUI
      - package: WiggleroomCore
        product: WiggleroomWindows
      - target: WiggleroomWidgets
        embed: true
        codeSign: true
      # The status line program ships next to the app's executable (Contents/MacOS).
      - target: wiggleroom-statusline
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Wiggleroom
        PRODUCT_BUNDLE_IDENTIFIER: io.github.garoknows.wiggleroom
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(WIGGLEROOM_APP_ENTITLEMENTS)

  # The widget. Sandboxed (WidgetKit requires it). Reads only the App Group snapshot.
  WiggleroomWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: WiggleroomCore
        product: WiggleroomCore
      - package: WiggleroomCore
        product: WiggleroomUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: WiggleroomWidgets
        PRODUCT_BUNDLE_IDENTIFIER: io.github.garoknows.wiggleroom.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(WIGGLEROOM_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES

  # The command Claude Code runs on every status line update.
  wiggleroom-statusline:
    type: tool
    platform: macOS
    sources:
      - path: Packages/WiggleroomCore/Sources/wiggleroom-statusline
    dependencies:
      - package: WiggleroomCore
        product: WiggleroomCore
    settings:
      base:
        PRODUCT_NAME: wiggleroom-statusline
        PRODUCT_BUNDLE_IDENTIFIER: io.github.garoknows.wiggleroom.statusline
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  Wiggleroom:
    build:
      targets:
        Wiggleroom: all
        WiggleroomWidgets: all
        wiggleroom-statusline: all
    test:
      targets:
        - package: WiggleroomCore/WiggleroomCoreTests
        - package: WiggleroomCore/StatuslineTests
        - package: WiggleroomCore/WindowLayoutTests
    archive:
      config: Release
